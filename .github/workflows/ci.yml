name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          pip install -r scripts/requirements.txt
          python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build site
        run: |
          npm ci
          npm run build
